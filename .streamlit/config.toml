[theme]
base = "dark"
primaryColor = "#ff6a1a"
backgroundColor = "#071033"
secondaryBackgroundColor = "#0c1a4a"
textColor = "#f4f7ff"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
showSidebarNavigation = false
